name: Check migration drift

on:
  # Every six hours, at 17 past to stay off the top of the hour where GitHub's
  # scheduler is most congested. The deploy workflow already covers the path
  # where a push touches `supabase/migrations/**`; this catches the cases no
  # trigger reaches — a version silently skipped as already-recorded, a migration
  # merged by a commit that touched nothing under that path, a deploy that failed
  # unnoticed — so its cadence only has to bound how long such a gap can hide.
  # Six hours costs four runs a day against an hourly schedule's twenty-four, for
  # a quarter-day worst case on a repo where prod trailing `main` is not an
  # outage.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-migration-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # Full history: the check dates each unapplied migration by when its file
      # landed on `main`, which a shallow clone cannot answer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      # `migration list --linked` reads the project from the linked-project file
      # rather than a `--project-ref` flag, exactly as `db push --linked` does, so
      # `link` writes it first. Neither needs a database password: the linked path
      # mints a temporary login role through the Management API, for which the
      # access token is the only credential.
      - name: Link the production project
        run: pnpm exec supabase link --project-ref dgfeittjtxjtgbretdkj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # A migration that merged in the last half hour is not drift: its deploy is
      # probably still queued or running. Anything older has had every chance to
      # apply, and a genuine miss surfaces on the next tick regardless.
      - name: Compare production against supabase/migrations
        run: pnpm check:migration-drift --grace-minutes=30
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
