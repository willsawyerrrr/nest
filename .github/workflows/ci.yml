name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No install yet: the two checks below are dependency-free and instant, so
      # they run ahead of the install and fail the build before anything slower
      # gets a chance to pass.
      - uses: ./.github/actions/setup-pnpm
        with:
          install: 'false'
      - run: pnpm check:migrations
      - run: pnpm check:vendor-edge
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Collecting coverage while running the suite is heavier than a bare run, so
    # the suite is split across six runners to keep each shard within the CI
    # time budget. Each shard records a blob report of its coverage; the `test`
    # job merges them. A single shard covers only part of the suite, so it skips
    # the thresholds (they are enforced on the merged result instead).
    #
    # The shard runs the `default` reporter alongside `blob`. The v8 worker
    # sends its coverage payload to the host over a fire-and-forget RPC that
    # nothing awaits, so with `blob` as the only reporter — it does no
    # end-of-run terminal work — the process reaches coverage finalisation
    # before the last payload lands, reads a coverage chunk that is not on
    # disk yet, and exits non-zero with every test passing. The `default`
    # reporter's end-of-run rendering yields the event loop long enough for
    # that payload to arrive first. `blob` stays for `--merge-reports`.
    env:
      VITEST_SKIP_COVERAGE_THRESHOLDS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/6 --coverage --reporter=default --reporter=blob
      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: [test-shard]
    # Always run so this required check reflects the shards' real result: a
    # failed shard makes `needs` "failure", which would otherwise skip this job —
    # and a skipped required check counts as passing, letting a broken shard
    # merge. Fail explicitly instead.
    if: ${{ always() }}
    steps:
      - run: |
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "A test shard did not succeed: ${{ needs.test-shard.result }}"
            exit 1
          fi
          echo "all shards passed"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          merge-multiple: true
          path: .vitest/blob/
      # Merge the shards' blob reports and enforce the coverage thresholds from
      # vitest.config.ts against the combined result; this replays the recorded
      # runs rather than executing the suite again.
      - run: pnpm exec vitest run --merge-reports --coverage

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/deno.lock') }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      # The task, not a bare `deno test`, so the permissions the suite needs live
      # in deno.json alongside the other function commands.
      - run: deno task test

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Apply auth shim, migrations, and RLS assertions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/setup_auth.sql
          # One psql process for every migration, applied in filename order. The
          # glob sorts lexically, which is timestamp order, and ON_ERROR_STOP
          # still aborts the run at the first failing statement — psql names the
          # offending file and line.
          printf '\\i %s\n' supabase/migrations/*.sql | psql -v ON_ERROR_STOP=1
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/rls_isolation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/derived_line_triggers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/payslip_financial_year.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/payslip_lines.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/deduction_basis.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/deduction_group.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/deduction_work_use.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/deduction_category.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/deduction_donation_group.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/share_grant.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/notification_preference.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/notification_log.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/reconcile_source_accounts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/reconcile_joint_up_accounts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/redbark_connection.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/wishlist_item.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/calendar_feed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/inflow_joint_split.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls/service_role_household_buffer_grants.sql
      # The migrated schema above is the reference `supabase gen types` runs
      # against: this fails if `apps/pwa/src/lib/database.types.ts` no longer
      # matches what the migrations produce (`check-migration-drift.yml` compares
      # migrations to prod, not the generated types).
      - name: Assert database.types.ts matches the migrations
        run: node scripts/gen-db-types.js --check --db-url "postgresql://postgres:postgres@localhost:5432/postgres"

  ci-status:
    name: CI Status
    if: ${{ always() }}
    needs: [check, test, functions, rls]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed (got '$r')."
              exit 1
            fi
          done
