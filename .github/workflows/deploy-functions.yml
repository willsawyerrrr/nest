name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COREPACK_HOME: ${{ github.workspace }}/.corepack
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache corepack pnpm binary
        uses: actions/cache@v4
        with:
          path: ${{ env.COREPACK_HOME }}
          key: corepack-${{ runner.os }}-pnpm-11.14.0
      - name: Enable corepack (provides pnpm@11.14.0)
        run: |
          corepack enable
          for attempt in 1 2 3; do
            corepack prepare pnpm@11.14.0 --activate && break
            echo "corepack prepare failed (attempt $attempt); retrying in 5s"
            sleep 5
          done
          pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Deploy with the Supabase CLI the lockfile pins, so the binary that reads
      # `supabase/config.toml` here is the one that reads it locally. A CLI
      # resolved outside the lockfile can be older than the config's keys, and
      # rejects the whole file before deploying anything.
      - run: pnpm exec supabase functions deploy --project-ref dgfeittjtxjtgbretdkj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
