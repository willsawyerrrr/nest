name: Deploy migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the post-deploy check can date any migration it finds
      # unapplied by when its file landed on `main`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      # Deploy with the Supabase CLI the lockfile pins, so the binary that reads
      # `supabase/config.toml` here is the one that reads it locally. A CLI
      # resolved outside the lockfile can be older than the config's keys, and
      # rejects the whole file before applying anything.
      #
      # `db push` takes the project from the linked-project file rather than a
      # `--project-ref` flag, so `link` writes it first. Neither command needs a
      # database password: the linked path mints a temporary login role through
      # the Management API, for which the access token is the only credential.
      - name: Link the production project
        run: pnpm exec supabase link --project-ref dgfeittjtxjtgbretdkj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # `--include-all` applies a migration whose version sorts below the head of
      # the remote history. Without it `db push` refuses the whole batch, and its
      # out-of-order files are skipped on every later run — so a migration merged
      # behind one with a higher version would never reach prod.
      #
      # `--yes` answers the "push these migrations?" confirmation. Unattended, the
      # prompt otherwise falls through to its default after a 100ms read of an
      # empty stdin, which is the right answer for the wrong reason.
      - name: Apply pending migrations
        run: pnpm exec supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # `db push` exits 0 having skipped a version already recorded in
      # `supabase_migrations.schema_migrations`, so a successful deploy is not
      # evidence that every migration applied. Assert it. No grace window here:
      # the push has just returned, so anything still unapplied is unapplied for
      # good — a grace window would forgive precisely the migration this catches.
      - name: Assert every migration applied
        run: pnpm check:migration-drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
