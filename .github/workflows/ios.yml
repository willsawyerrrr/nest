name: iOS

# Informational only — not one of the four jobs `CI Status` aggregates, and not a
# required check. `apps/ios` is a thin WKWebView shell plus App Intents; a
# regression there should show up, but a macOS runner is far too slow to sit on
# the sub-minute `CI Status` path. Path-filtered so it runs only when the iOS
# sources or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # The generated project and Info.plist are not committed; project.yml is
      # the source of truth.
      - name: Generate the Xcode project
        run: xcodegen generate

      # `xcodebuild build` runs appintentsmetadataprocessor, which validates the
      # App Shortcut phrases (`Metadata.appintents` in the built app) — a phrase
      # missing `\(.applicationName)`, a duplicate identifier, or an unresolvable
      # parameter type fails here. Do NOT set SWIFT_EXEC: it drops
      # `--compile-time-extraction` and breaks that extraction on Xcode 16+.
      - name: Build (validates App Intents metadata)
        run: |
          xcodebuild \
            -project Nest.xcodeproj \
            -scheme Nest \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build

      # A booted simulator's udid, resolved rather than hard-coded so the
      # workflow does not break when the runner image's device list shifts.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))][0].udid')
          test -n "$udid" || { echo "no iPhone simulator available"; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild \
            -project Nest.xcodeproj \
            -scheme Nest \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            test

  build-catalyst:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # A runner carries no development team, so signing is off for this
      # build-and-test-only run — nothing here is installed anywhere. This
      # still runs appintentsmetadataprocessor (see the iOS job's comment),
      # so a bad App Shortcut phrase fails here too.
      - name: Build for Mac Catalyst (validates App Intents metadata)
        run: |
          xcodebuild \
            -project Nest.xcodeproj \
            -scheme Nest \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Nest.xcodeproj \
            -scheme Nest \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test
