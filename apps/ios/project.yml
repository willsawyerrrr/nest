name: Nest
options:
  bundleIdPrefix: dev.willsawyerrrr
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'

targets:
  Nest:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget:
      iOS: '17.0'
    sources:
      - path: Nest
    dependencies:
      - package: Supabase
        product: Auth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Nest/Info.plist
      properties:
        CFBundleDisplayName: Nest
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only the encryption built into Apple's operating system (HTTPS), so
        # App Store Connect skips the export-compliance questions per build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # The iOS-type Google OAuth client (public, like the Supabase anon key).
        # Its reversed form is the URL scheme Google Sign-In returns to.
        GIDClientID: 878376923948-40983m6oavpmvfkn520npd9vv0ujk1aq.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.willsawyerrrr.nest
            CFBundleURLSchemes:
              - com.googleusercontent.apps.878376923948-40983m6oavpmvfkn520npd9vv0ujk1aq
        # Substituted by `xcodegen generate` from the process environment (see
        # `apps/ios/.env.example`); read at runtime in `Supabase.swift`. Left
        # as XcodeGen's literal `${VAR}` placeholder when unset — `Supabase.swift`
        # treats that the same as missing.
        SupabaseURL: ${SUPABASE_URL}
        SupabaseAnonKey: ${SUPABASE_ANON_KEY}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.nest
        PRODUCT_NAME: Nest
        ENABLE_PREVIEWS: true
        # Without this, Keychain writes — the PKCE code verifier included —
        # fail silently with errSecMissingEntitlement (-34018) on Mac
        # Catalyst, which macOS enforces far more strictly here than iOS.
        CODE_SIGN_ENTITLEMENTS: Nest/Nest.entitlements
        # The household's Apple Developer team — resolving
        # `$(AppIdentifierPrefix)` in Nest.entitlements needs one. CI builds
        # with `CODE_SIGNING_ALLOWED=NO` and never reaches this.
        DEVELOPMENT_TEAM: 8558CXPT9G

  NestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: NestTests
    dependencies:
      - target: Nest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.nest.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Nest:
    build:
      targets:
        Nest: all
        NestTests: [test]
    test:
      targets:
        - NestTests
    run:
      config: Debug
