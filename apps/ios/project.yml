name: Nest
options:
  bundleIdPrefix: dev.willsawyerrrr
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'

targets:
  Nest:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget:
      iOS: '17.0'
    sources:
      - path: Nest
    dependencies:
      - package: Supabase
        product: Auth
    info:
      path: Nest/Info.plist
      properties:
        CFBundleDisplayName: Nest
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.willsawyerrrr.nest.ios
            CFBundleURLSchemes:
              - dev.willsawyerrrr.nest.ios
        # Substituted by `xcodegen generate` from the process environment (see
        # `apps/ios/.env.example`); read at runtime in `Supabase.swift`. Left
        # as XcodeGen's literal `${VAR}` placeholder when unset — `Supabase.swift`
        # treats that the same as missing.
        SupabaseURL: ${SUPABASE_URL}
        SupabaseAnonKey: ${SUPABASE_ANON_KEY}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.nest.ios
        PRODUCT_NAME: Nest
        ENABLE_PREVIEWS: true

  NestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: NestTests
    dependencies:
      - target: Nest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.nest.ios.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Nest:
    build:
      targets:
        Nest: all
        NestTests: [test]
    test:
      targets:
        - NestTests
    run:
      config: Debug
